<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090a10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="#090a10"/>
  <circle cx="256" cy="256" r="210" fill="url(#bgGlow)"/>

  <!-- Orbital Cyber Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="12 16" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>

  <!-- Left Cartoon Bat Wing -->
  <path d="M 190 260 C 140 210, 70 210, 40 280 C 70 295, 110 320, 140 310 C 150 340, 180 340, 200 310 Z" fill="url(#wingGrad)" filter="url(#glow)"/>
  
  <!-- Right Cartoon Bat Wing -->
  <path d="M 322 260 C 372 210, 442 210, 472 280 C 442 295, 402 320, 372 310 C 362 340, 332 340, 312 310 Z" fill="url(#wingGrad)" filter="url(#glow)"/>

  <!-- Bat Ears -->
  <polygon points="200,200 160,110 230,160" fill="#3b0764"/>
  <polygon points="195,190 170,125 220,165" fill="#e11d48"/>

  <polygon points="312,200 352,110 282,160" fill="#3b0764"/>
  <polygon points="317,190 342,125 292,165" fill="#e11d48"/>

  <!-- Cartoon Round Body -->
  <ellipse cx="256" cy="280" rx="90" ry="85" fill="url(#bodyGrad)" stroke="#e11d48" stroke-width="3"/>

  <!-- Cute Big Expressive Eyes -->
  <ellipse cx="225" cy="265" rx="22" ry="26" fill="#ffffff" filter="url(#glow)"/>
  <ellipse cx="225" cy="265" rx="14" ry="17" fill="url(#eyeGrad)"/>
  <circle cx="220" cy="258" r="6" fill="#ffffff"/>
  <circle cx="228" cy="272" r="3" fill="#ffffff"/>

  <ellipse cx="287" cy="265" rx="22" ry="26" fill="#ffffff" filter="url(#glow)"/>
  <ellipse cx="287" cy="265" rx="14" ry="17" fill="url(#eyeGrad)"/>
  <circle cx="282" cy="258" r="6" fill="#ffffff"/>
  <circle cx="290" cy="272" r="3" fill="#ffffff"/>

  <!-- Cheerful Smile with Cute Vampire Fangs -->
  <path d="M 235 305 Q 256 322 277 305" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Left fang -->
  <polygon points="242,308 248,308 245,318" fill="#ffffff"/>
  <!-- Right fang -->
  <polygon points="264,308 270,308 267,318" fill="#ffffff"/>

  <!-- Rosy Cute Blush -->
  <ellipse cx="205" cy="290" rx="10" ry="6" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="307" cy="290" rx="10" ry="6" fill="#fb7185" opacity="0.6"/>

  <!-- Tiny Cyber Head Antenna / Crystal -->
  <polygon points="256,165 264,180 256,195 248,180" fill="#38bdf8" filter="url(#glow)"/>
</svg>
